<BODY LEFTMARGIN="60" BGCOLOR= #FF0000 TEXT= #FFFF00 LINK = #000000>
<P>PFC Stanley J Best: Joined Company C on Maui after the company returned from the Saipan/Tinian
  operations. He was wounded in action March 3, 1945 on Iwo Jima and died of wounds
March 9, 1945.</p>
