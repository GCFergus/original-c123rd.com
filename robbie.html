	<title>KIA Sketch Paul E Robbie</title>
</head>

<BODY LEFTMARGIN="60" BGCOLOR= #FF0000 TEXT= #FFFF00 LINK = #000000>
<P>Pvt Paul E Robbie: Joined Company C on Iwo Jima March 2, 1945.
Died of wounds and buried on Iwo Jima March 11, 1945. We do not know
the date he was wounded or the date of his death.

</p>
